name: Daily reviewed sales research
on:
  schedule:
    - cron: '25 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    if: vars.STOCKWISE_SALES_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: stockwise-daily-sales-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/sales-daily-research.mjs
      - name: Save research-only results (never a send queue)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-research-${{ github.run_id }}
          path: ${{ runner.temp }}/stockwise-research-daily.json
          if-no-files-found: ignore
          retention-days: 30
